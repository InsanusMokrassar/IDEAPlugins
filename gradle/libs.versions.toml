[versions]
kotlin = "2.4.0"
intellij-platform = "2.19.0"
junit = "4.13.2"
koin = "4.2.2"
micro-utils = "0.30.1"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler", version.ref = "kotlin" }
koin-core = { module = "io.insert-koin:koin-core-jvm", version.ref = "koin" }
micro-utils-koin = { module = "dev.inmo:micro_utils.koin-jvm", version.ref = "micro-utils" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
