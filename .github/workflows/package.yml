name: Package IDEAPlugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish each create-only publication before starting another release run.
concurrency:
  group: plugin-release-main
  cancel-in-progress: false
  queue: max

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17 and 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: gradle

      - name: Check bundle packaging and publication safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Test, verify and build all plugin ZIPs
        run: >-
          ./build-plugins.sh --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8'
          check

      - name: Package all three plugins into one repository-named ZIP
        id: package
        run: python3 .github/scripts/package_plugins.py

      - name: Keep the bundle ZIP as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # overwrite uses this name even when archive: false derives it from the file.
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          archive: false
          # A retry replaces only this run's artifact; release assets remain immutable.
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish the bundle version once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG"
          python3 .github/scripts/publish_release.py

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/*.xml
            **/build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 7
